<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cumplimiento del Día</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cumplimiento">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Estilo RutaPDV: fondo gris claro, paneles blancos, azul #1F4E8C, letra Inter. Una columna: resumen del equipo → tabla por ruta → detalle */
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --field:#F8FAFC; --line:#D8DFE7; --line2:#E6EBF1;
  --ink:#14202E; --muted:#5A6878; --dim:#8996A5; --blue:#1F4E8C; --blue-soft:#E8EEF7;
  --ok:#17803D; --ok-soft:#E7F4EC; --warn:#B25E09; --warn-soft:#FBF1E2; --bad:#C0352F; --bad-soft:#FAE9E8;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line2);padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand h1{font:800 22px/1.1 var(--f);letter-spacing:.9px;margin:0;color:var(--blue)}
.brand small{display:block;color:var(--muted);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:12px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:13.5px}
.iconbtn svg{width:18px;height:18px}
.iconbtn[disabled]{opacity:.5}
main{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:14px 50px;display:grid;gap:14px}
.box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:14px;display:grid;gap:10px}
h2{font:800 17px/1.25 var(--f);margin:0;text-wrap:balance}
h3{font:800 14px/1.25 var(--f);margin:0;text-transform:uppercase;letter-spacing:.48px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
.note b{color:var(--ink)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.day[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;background:var(--warn-soft);color:#6b3a06}
.banner b{color:inherit}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line2);border-left:4px solid var(--dim);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi small{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi b{font:800 28px/1.1 var(--f)}
.kpi span{font-size:13px;font-weight:600}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi.ok{border-left-color:var(--ok)}.kpi.ok b{color:var(--ok)}
.kpi.warn{border-left-color:var(--warn)}.kpi.warn b{color:var(--warn)}
.kpi.bad{border-left-color:var(--bad)}.kpi.bad b{color:var(--bad)}
.bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--dim)}
.ok .bar i{background:var(--ok)}.warn .bar i{background:var(--warn)}.bad .bar i{background:var(--bad)}
.tabw{overflow-x:auto;border:1px solid var(--line2);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--field)}
tbody tr[aria-selected="true"] td{background:var(--blue-soft)}
tfoot td{font-weight:800;border-bottom:0}
.pc{display:inline-block;min-width:52px;padding:2px 8px;border-radius:999px;font-weight:800;font-size:12.5px;text-align:center}
.pc.ok{background:var(--ok-soft);color:var(--ok)}.pc.warn{background:var(--warn-soft);color:var(--warn)}.pc.bad{background:var(--bad-soft);color:var(--bad)}.pc.na{background:var(--line2);color:var(--muted)}
td small{display:block;color:var(--muted);font-size:11.5px}
.det{display:grid;gap:12px}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--field);border:1px solid var(--line2);border-radius:10px;padding:8px 10px}
.row .l{font-weight:700;min-width:0}
.row .l small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.row .bar{grid-column:1/-1;margin:0}
.login{display:grid;gap:10px;max-width:420px}
.login input{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:11px 12px;font-size:16px;text-transform:uppercase;letter-spacing:.5px}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:12px;padding:11px 14px;font-weight:800}
.msg{font-size:13.5px;color:var(--bad);margin:0}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head><body>
<header class="top">
  <div class="brand"><h1>CUMPLIMIENTO</h1><small id="hdr">Logrado en el día vs lo necesario</small></div>
  <button class="iconbtn" id="btnSync" title="Buscar datos nuevos" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
</header>
<main id="main">
  <section class="box" id="loginBox" hidden>
    <h2>Entrar</h2>
    <p class="note">Usa tu <b>código de supervisor</b> de Ruta PDV. Solo se pide una vez en este teléfono.</p>
    <div class="login">
      <input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Ej. TODAS-XXXXXXX">
      <button class="btn" id="btnLogin" type="button">Entrar</button>
      <p class="msg" id="loginMsg" role="alert"></p>
    </div>
  </section>
  <div id="view"></div>
</main>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, d = 0) => n == null || isNaN(n) ? "—" : Number(n).toLocaleString("es-SV", {maximumFractionDigits:d, minimumFractionDigits:0});
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

/* ---------- acceso y datos (los mismos paquetes cifrados de Ruta PDV) ---------- */
const TXT = new TextEncoder();
const normCode = c => String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
async function codeId(code){
  const base = await crypto.subtle.importKey("raw", TXT.encode(normCode(code)), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt:TXT.encode("rutapdv-archivo-v2"), iterations:300000, hash:"SHA-256"}, base, 128);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function deriveKey(code, salt){
  const base = await crypto.subtle.importKey("raw", TXT.encode(normCode(code)), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:300000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
const streamThrough = (buf, tr) => new Response(new Blob([buf]).stream().pipeThrough(tr)).arrayBuffer();
async function decryptPack(buf, code){
  const u = new Uint8Array(buf);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:u.slice(16, 28)}, await deriveKey(code, u.slice(0, 16)), u.slice(28));
  return JSON.parse(new TextDecoder().decode(await streamThrough(plain, new DecompressionStream("gzip"))));
}
const idb = name => ({
  open(){ return new Promise((res, rej) => { try{ const r = indexedDB.open(name, 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); },
  async get(k){ try{ const db = await this.open(); return await new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }catch(e){ return null; } },
  async set(k, v){ try{ const db = await this.open(); await new Promise(res => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = res; }); }catch(e){} }
});
const DBC = idb("cumplimiento"), DBR = idb("rutapdv");   // propia / la de Ruta PDV (mismo sitio: reusa tu código si ya entraste allá)
let ST = {code:"", version:"", fecha:"", scope:"", dias:{}};

async function fetchJSON(u){ const r = await fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache:"no-store"}); if (!r.ok) throw Object.assign(new Error("http"), {status:r.status}); return r.json(); }
async function pull(code, force){
  const man = await fetchJSON("../manifest.json").catch(() => null);
  if (!force && man && man.version && man.version === ST.version && ST.code === normCode(code)) return "igual";
  const id = await codeId(code);
  const r = await fetch(`../data/${id}.bin?t=${Date.now()}`, {cache:"no-store"});
  if (r.status === 404) throw new Error("bad");
  if (!r.ok) throw new Error("net");
  let pack; try{ pack = await decryptPack(await r.arrayBuffer(), code); }catch(e){ throw new Error("bad"); }
  const H = pack.S && pack.S.hist;
  if (!H || !H.dias) throw new Error(pack.S ? "nohist" : "bad");
  ST.dias = Object.assign({}, ST.dias, H.dias);      // se juntan: el teléfono guarda los cierres aunque el Publicador los pierda
  const keep = Object.keys(ST.dias).sort().slice(-75); ST.dias = Object.fromEntries(keep.map(k => [k, ST.dias[k]]));
  ST.code = normCode(code); ST.version = pack.version || (man && man.version) || ""; ST.fecha = pack.fecha || ""; ST.scope = pack.scope || "";
  await DBC.set("st", ST);
  return "nuevo";
}

/* ---------- calendario: días hábiles (lunes a sábado, sin feriados nacionales) ---------- */
const FERIADOS = new Set(["2026-01-01","2026-04-02","2026-04-03","2026-04-04","2026-05-01","2026-05-10","2026-06-17","2026-08-06","2026-09-15","2026-11-02","2026-12-25",
  "2027-01-01","2027-03-25","2027-03-26","2027-03-27","2027-05-01","2027-05-10","2027-06-17","2027-08-06","2027-09-15","2027-11-02","2027-12-25"]);
const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const pd = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const habil = d => d.getDay() !== 0 && !FERIADOS.has(key(d));
function habilesRest(k){ const d = pd(k), m = d.getMonth(); let n = 0; for (const x = new Date(d); x.getMonth() === m; x.setDate(x.getDate() + 1)) if (habil(x) && !esUltHab(x)) n++; return Math.max(1, n); }   // desde ese día (incluido) a fin de mes, sin el último día hábil (en preventa ya es venta del mes siguiente)
function esUltHab(x){ const z = new Date(x.getFullYear(), x.getMonth() + 1, 0); while (!habil(z)) z.setDate(z.getDate() - 1); return z.getDate() === x.getDate(); }
function habilesEntre(a, b){ let n = 0; const x = pd(a); x.setDate(x.getDate() + 1); for (; key(x) <= b; x.setDate(x.getDate() + 1)) if (habil(x)) n++; return Math.max(1, n); }   // (a, b]
const largo = k => { const d = pd(k); const s = `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; return s.charAt(0).toUpperCase() + s.slice(1); };
const corto = k => { const d = pd(k); return `${DIAS[d.getDay()].slice(0, 3)} ${d.getDate()}`; };

/* ---------- cálculo: lo logrado entre el cierre anterior y este, contra lo que se necesitaba ---------- */
const VOL_ORD = ["PORTAFOLIO ORO","VOLUMEN CSD","ISO/ADR","ALCOHOLICAS","OTROS"];
const EV_LAB = {multi:"Multi Serve", single:"Single Serve", gatorade:"Gatorade 600", cerveza:"Cerveza"};
const cls = p => p == null ? "na" : p >= 1 ? "ok" : p >= .8 ? "warn" : "bad";
const pct = p => p == null ? "—" : Math.round(p * 100) + "%";
function calc(fT){
  const fechas = Object.keys(ST.dias).sort(), T = ST.dias[fT];
  const fB = fechas.filter(f => f < fT).pop() || null, B = fB ? ST.dias[fB] : null;
  const mismoMes = fB && fB.slice(0, 7) === fT.slice(0, 7);
  const dRest = mismoMes ? habilesRest(fB) : habilesRest(fT.slice(0, 8) + "01");   // días hábiles que quedaban al empezar el día
  const out = {fT, fB, mismoMes, wd: mismoMes ? habilesEntre(fB, fT) : habilesEntre(prevMonthEnd(fT), fT), rutas:new Map()};
  for (const [r, t] of Object.entries(T.r || {})){
    const b = B && B.r ? B.r[r] : null, o = {r, items:[]};
    // volumen por categoría (cajas físicas): necesidad del cubo al cierre anterior × días hábiles del período
    if (t.vol){
      const it = (lab, tv, bv, sub) => {
        if (!tv || !(tv[1] > 0)) return;
        const realB = mismoMes && bv ? bv[0] : 0, metaB = mismoMes && bv ? bv[1] : tv[1];
        const necDia = mismoMes && bv && bv[2] != null ? Math.max(0, bv[2]) : Math.max(0, metaB - realB) / dRest;
        o.items.push({g:"vol", lab, sub, log: tv[0] - realB, nec: necDia * out.wd, real: tv[0], meta: tv[1], ok: bv != null || !mismoMes});
      };
      it("Volumen total", t.vol.tot, b && b.vol ? b.vol.tot : null, true);
      for (const k of VOL_ORD){ const tv = t.vol.cats[k]; if (tv) it(tv[3] || k, tv, b && b.vol ? (b.vol.cats[k] || null) : null, false); }
    }
    // Everest: coberturas (clientes) por categoría
    if (t.ev) for (const [k, tv] of Object.entries(t.ev)){
      const bv = b && b.ev ? b.ev[k] : null;
      const realB = mismoMes && bv ? bv[0] : 0, metaB = mismoMes && bv ? bv[1] : tv[1];
      o.items.push({g:"ev", lab: EV_LAB[k] || k, log: tv[0] - realB, nec: Math.ceil(Math.max(0, metaB - realB) / dRest) * out.wd, real: tv[0], meta: tv[1], ok: bv != null || !mismoMes});
    }
    // R+N: equipos que salieron de rojo/negro
    if (t.rn && b && b.rn){
      const exceso = Math.max(0, b.rn[0] - b.rn[2]);
      o.items.push({g:"rn", lab:"Equipos sacados de R+N", log: b.rn[0] - t.rn[0], nec: Math.ceil(exceso / (mismoMes ? dRest : habilesRest(fT))) * out.wd, real: t.rn[0], meta: t.rn[2], base: t.rn[1], ok:true});
    } else if (t.rn) o.items.push({g:"rn", lab:"Equipos sacados de R+N", log:null, nec:null, real:t.rn[0], meta:t.rn[2], base:t.rn[1], ok:false});
    // Wellington: meta 95% de los equipos leídos (pueden quedar sin leer hasta el 5% de la base de equipos)
    if (t.wl && b && b.wl){
      const perm = b.wl[2] ? Math.floor(b.wl[2] * 0.05) : 0;
      o.items.push({g:"wl", lab:"Lecturas Wellington", log: b.wl[1] - t.wl[1], nec: Math.ceil(Math.max(0, b.wl[1] - perm) / (mismoMes ? dRest : habilesRest(fT))) * out.wd, real: t.wl[1], cli: t.wl[0], ok:true});
    } else if (t.wl) o.items.push({g:"wl", lab:"Lecturas Wellington", log:null, nec:null, real:t.wl[1], cli:t.wl[0], ok:false});
    for (const it of o.items) it.p = it.log == null || !it.ok ? null : it.nec > 0 ? Math.max(0, it.log) / it.nec : (it.log >= 0 ? 1 : 0);
    out.rutas.set(r, o);
  }
  return out;
}
function prevMonthEnd(f){ const d = pd(f.slice(0, 8) + "01"); d.setDate(0); return key(d); }
const sumG = (o, g, onlyTot) => { const xs = o.items.filter(x => x.g === g && (g !== "vol" || (onlyTot ? x.sub : !x.sub))); if (!xs.length) return null;
  const s = {log:0, nec:0, real:0, meta:0, ok:xs.every(x => x.ok && x.log != null)}; for (const x of xs){ s.log += x.log || 0; s.nec += x.nec || 0; s.real += x.real || 0; s.meta += x.meta || 0; }
  s.p = !s.ok ? null : s.nec > 0 ? Math.max(0, s.log) / s.nec : (s.log >= 0 ? 1 : 0); return s; };

/* ---------- vista ---------- */
let SEL = "", RSEL = "", SUP = (() => { try{ return localStorage.getItem("cump_sup") || ""; }catch(e){ return ""; } })();
const GRUPOS = [["vol","Volumen","CJ"],["ev","Everest","cob."],["rn","R+N","equipos"],["wl","Wellington","lecturas"]];
function render(){
  const fechas = Object.keys(ST.dias).sort();
  const v = $("#view");
  if (!fechas.length){ v.innerHTML = `<section class="box empty"><b>Todavía no hay cierres guardados</b>Publica con el Publicador al cierre del día y vuelve a abrir esta app.</section>`; return; }
  if (!SEL || !ST.dias[SEL]) SEL = fechas[fechas.length - 1];
  const C = calc(SEL), T = ST.dias[SEL];
  const sups = [...new Set([...C.rutas.keys()].map(r => (T.r[r] || {}).sup).filter(Boolean))].sort();
  if (SUP && !sups.includes(SUP)) SUP = "";
  if (SUP) for (const r of [...C.rutas.keys()]) if ((T.r[r] || {}).sup !== SUP) C.rutas.delete(r);
  $("#hdr").textContent = `${SUP || ST.scope || "Equipo"} · ${C.rutas.size} rutas`;
  let h = `<section class="box"><div class="days" role="group" aria-label="Cierre">${fechas.slice(-14).reverse().map(f => `<button class="day" data-day="${f}" aria-pressed="${f === SEL}">${f === fechas[fechas.length - 1] ? "Último · " : ""}${esc(corto(f))}</button>`).join("")}</div>
    ${sups.length > 1 ? `<div class="days" role="group" aria-label="Supervisor"><button class="day" data-sup="" aria-pressed="${!SUP}">Todos</button>${sups.map(x => `<button class="day" data-sup="${esc(x)}" aria-pressed="${x === SUP}">${esc(x)}</button>`).join("")}</div>` : ""}
    <h2>${esc(largo(SEL))}</h2>
    <p class="note">Cierre publicado ${T.t ? new Date(T.t).toLocaleString("es-SV", {dateStyle:"short", timeStyle:"short"}) : ""}${T.info && T.info.vol ? ` · Power BI al <b>${esc(T.info.vol)}</b>` : ""}${T.info && T.info.base ? ` · listados al <b>${esc(T.info.base)}</b>` : ""}${C.mismoMes ? ` · comparado con el cierre del <b>${esc(largo(C.fB).toLowerCase())}</b>${C.wd > 1 ? ` (${C.wd} días hábiles)` : ""}` : ` · volumen y Everest desde el inicio del mes (${C.wd} días hábiles)`}</p>`;
  if (!C.fB) h += `<p class="banner">Este es el <b>primer cierre guardado</b>. Desde el próximo cierre verás lo logrado en el día. Por ahora: el volumen y Everest cuentan desde el inicio del mes; R+N y Wellington necesitan dos cierres.</p>`;
  h += `</section>`;
  // resumen del equipo
  const tot = {}; for (const [g] of GRUPOS){ const xs = [...C.rutas.values()].map(o => sumG(o, g, true)).filter(Boolean); if (!xs.length) continue;
    const s = {log:0, nec:0, ok:xs.every(x => x.ok)}; xs.forEach(x => { s.log += x.log; s.nec += x.nec; }); s.p = !s.ok ? null : s.nec > 0 ? Math.max(0, s.log) / s.nec : (s.log >= 0 ? 1 : 0); tot[g] = s; }
  h += `<section class="kpis">${GRUPOS.filter(([g]) => tot[g]).map(([g, l, u]) => { const s = tot[g], c = cls(s.p), w = s.p == null ? 0 : Math.min(100, s.p * 100);
    return `<div class="kpi ${c}"><small>${l}</small><b>${pct(s.p)}</b><div class="bar"><i style="width:${w.toFixed(0)}%"></i></div><span class="num">${s.p == null ? "sin cierre anterior" : `${fmt(s.log)} de ${fmt(s.nec)} ${u}`}</span><em>${g === "rn" ? "sacados del rojo/negro" : g === "wl" ? "equipos leídos" : g === "ev" ? "coberturas nuevas" : "cajas físicas vendidas"}</em></div>`; }).join("")}</section>`;
  // tabla por ruta
  const rs = [...C.rutas.values()].sort((a, b) => { const sc = o => { const ps = GRUPOS.map(([g]) => (sumG(o, g, true) || {}).p).filter(p => p != null); return ps.length ? ps.reduce((x, y) => x + Math.min(1, y), 0) / ps.length : 9; }; return sc(a) - sc(b); });
  const gs = GRUPOS.filter(([g]) => tot[g]);
  const cell = s => !s ? `<td>—</td>` : `<td><span class="pc ${cls(s.p)}">${pct(s.p)}</span><small>${s.log == null || !s.ok ? "—" : `${fmt(s.log)} / ${fmt(s.nec)}`}</small></td>`;
  h += `<section class="box"><h3>Por ruta · la más atrasada primero</h3><div class="tabw"><table><thead><tr><th>Ruta</th>${gs.map(([, l]) => `<th>${l}</th>`).join("")}</tr></thead><tbody>${rs.map(o => `<tr data-ruta="${esc(o.r)}" aria-selected="${o.r === RSEL}"><td><b>${esc(o.r)}</b></td>${gs.map(([g]) => cell(sumG(o, g, true))).join("")}</tr>`).join("")}</tbody>
    <tfoot><tr><td>Equipo</td>${gs.map(([g]) => `<td><span class="pc ${cls(tot[g].p)}">${pct(tot[g].p)}</span></td>`).join("")}</tr></tfoot></table></div>
    <p class="note">% = lo logrado en el día ÷ lo necesario para ir al día con la meta del mes. Toca una ruta para ver el detalle.</p></section>`;
  // detalle de la ruta
  if (!RSEL || !C.rutas.has(RSEL)) RSEL = rs.length ? rs[0].r : "";
  const o = C.rutas.get(RSEL);
  if (o){
    const row = x => { const c = cls(x.p), w = x.p == null ? 0 : Math.min(100, x.p * 100);
      const acum = x.g === "vol" || x.g === "ev" ? `llevas ${fmt(x.real)} de ${fmt(x.meta)} en el mes` : x.g === "rn" ? `${fmt(x.real)} en R+N de ${fmt(x.base)} equipos · meta ${fmt(x.meta)}` : `${fmt(x.real)} equipos sin leer en ${fmt(x.cli)} clientes`;
      return `<div class="row ${c}"><div class="l">${esc(x.lab)}<small>${acum}</small></div><div class="num"><span class="pc ${c}">${pct(x.p)}</span></div><div class="bar"><i style="width:${w.toFixed(0)}%"></i></div><div class="note num" style="grid-column:1/-1">${x.log == null || !x.ok ? "Necesita el cierre anterior para comparar" : `Logrado <b>${fmt(x.log)}</b> · necesario <b>${fmt(x.nec)}</b>`}</div></div>`; };
    h += `<section class="box det"><div class="dhead"><h2>Ruta ${esc(o.r)}</h2><span class="note">${esc(largo(SEL))}</span></div>`;
    for (const [g, l] of GRUPOS){ const xs = o.items.filter(x => x.g === g); if (!xs.length) continue; h += `<h3>${l}</h3><div class="rows">${xs.map(row).join("")}</div>`; }
    h += `</section>`;
  }
  h += `<p class="note">Lo necesario sale del cierre anterior: volumen = necesidad diaria de Power BI; Everest y R+N = lo que faltaba ÷ días hábiles que quedaban (lunes a sábado, sin feriados); Wellington = equipos sin leer por encima del 5% permitido ÷ días hábiles, para llegar al 95% de lecturas a fin de mes.</p>`;
  v.innerHTML = h;
}
$("#view").addEventListener("click", e => {
  const d = e.target.closest("[data-day]"); if (d){ SEL = d.dataset.day; render(); return; }
  const su = e.target.closest("[data-sup]"); if (su){ SUP = su.dataset.sup; try{ localStorage.setItem("cump_sup", SUP); }catch(err){} RSEL = ""; render(); return; }
  const r = e.target.closest("[data-ruta]"); if (r){ RSEL = r.dataset.ruta; render(); const det = document.querySelector(".det"); if (det) det.scrollIntoView({behavior:"smooth", block:"start"}); }
});

/* ---------- arranque ---------- */
function showLogin(msg){ $("#loginBox").hidden = false; $("#loginMsg").textContent = msg || ""; $("#btnSync").hidden = true; }
const ERR = {bad:"Ese código no existe o ya cambió. Usa el código de supervisor de Ruta PDV.", net:"Sin conexión. Intenta de nuevo cuando tengas señal.", nohist:"Ese código no trae los cierres del día. Usa tu código de supervisor (no el de un vendedor) y publica con el Publicador nuevo."};
async function login(code, quiet){
  const b = $("#btnLogin"); b.disabled = true; b.innerHTML = `<span class="spin"></span> Verificando…`;
  try{ await pull(code, true); $("#loginBox").hidden = true; $("#btnSync").hidden = false; render(); return true; }
  catch(e){ if (!quiet) showLogin(ERR[e.message] || ERR.net); return false; }
  finally{ b.disabled = false; b.textContent = "Entrar"; }
}
$("#btnLogin").onclick = () => { const c = $("#code").value; if (normCode(c).length < 6){ $("#loginMsg").textContent = "Escribe el código completo."; return; } login(c); };
$("#code").addEventListener("keydown", e => { if (e.key === "Enter") $("#btnLogin").click(); });
$("#btnSync").onclick = async () => { const b = $("#btnSync"); b.disabled = true; try{ const r = await pull(ST.code, false); if (r === "nuevo"){ SEL = ""; } render(); }catch(e){ alertBox(ERR[e.message] || ERR.net); } finally{ b.disabled = false; } };
function alertBox(t){ const v = $("#view"); v.insertAdjacentHTML("afterbegin", `<p class="banner">${esc(t)}</p>`); }
(async function start(){
  const s = await DBC.get("st"); if (s && s.code) ST = Object.assign(ST, s);
  if (ST.code){ $("#btnSync").hidden = false; render(); try{ const r = await pull(ST.code, false); if (r === "nuevo"){ SEL = ""; render(); } }catch(e){ if (e.message === "bad" || e.message === "nohist") showLogin(ERR[e.message]); } return; }
  // ¿ya entraste a Ruta PDV en este teléfono con un código de supervisor? se reusa
  const r = await DBR.get("data"); const c = r && r.SRC && r.SRC.code;
  if (c && await login(c, true)) return;
  showLogin();
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && ST.code) pull(ST.code, false).then(r => { if (r === "nuevo"){ SEL = ""; render(); } }).catch(() => {}); });
</script>
